font_family JetBrainsMono Nerd Font
font_size 12


hide_window_decorations yes
window_padding_width 4
dynamic_background_opacity yes
background_opacity 0.74
background_blur 20

# Herdr themes its own UI surfaces; make those cell backgrounds translucent
# too, so niri's blur and the wallpaper show through the panes. Panes and the
# sidebar keep more body than the plain background so the layout stays readable.
transparent_background_colors #1e1e2e@0.85 #181825@0.9 #313244@0.92

# Disable Linux/X11-style primary-selection paste on middle click.
mouse_map middle release ungrabbed
mouse_map shift+middle release ungrabbed,grabbed
mouse_map shift+middle press grabbed discard_event

# Noctalia renders this file and reloads running Kitty instances.
include themes/noctalia.conf
