# GTK 4's default Vulkan renderer failed in xdg-desktop-portal-gnome on this NVIDIA
# GPU (RTX 5090): the journal repeated "vkAcquireNextImageKHR(): ... VK_ERROR_OUT_OF_DATE_KHR"
# (2026-07-07). Force GTK's OpenGL renderer for the portal only. To retest after a
# GTK/NVIDIA update: remove this drop-in, `systemctl --user daemon-reload`, restart the
# portal, then try a screen share and watch `journalctl --user -u xdg-desktop-portal-gnome`.
[Service]
Environment=GSK_RENDERER=gl
