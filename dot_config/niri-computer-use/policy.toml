# niri-computer-use policy. Agents may run any niri action (Spawn included), the
# noctalia passthrough, and presets with arguments; still under the lease, the stop
# key and the audit log.
unrestricted = true

# screenshot save_path writes here.
capture_dir = "~/Pictures/agent"

# Every client goes through the one shared engine; no standalone fallback.
shared = "required"
