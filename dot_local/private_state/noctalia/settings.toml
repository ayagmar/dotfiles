config_version = 16

[bar.default]
end = [ "bar", "headroom", "agents", "obs", "tray", "notifications", "volume", "control-center" ]

[desktop_widgets]
schema_version = 2
widget_order = [ "clock", "weather", "calendar", "binance", "media" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.binance]
    box_height = 0.0
    box_width = 0.0
    cx = 2272.0
    cy = 1098.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "ayagmar/binance:desktop"

    [desktop_widgets.widget.calendar]
    box_height = 400.0
    box_width = 480.0
    cx = 2272.0
    cy = 704.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "calendar"

        [desktop_widgets.widget.calendar.settings]
        show_events = false

    [desktop_widgets.widget.clock]
    box_height = 160.0
    box_width = 480.0
    cx = 2272.0
    cy = 176.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.clock.settings]
        center_text = true
        format = "{:%H:%M}"

    [desktop_widgets.widget.media]
    box_height = 180.0
    box_width = 560.0
    cx = 328.0
    cy = 1302.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.media.settings]
        album_art_background = true

    [desktop_widgets.widget.weather]
    box_height = 200.0
    box_width = 480.0
    cx = 2272.0
    cy = 380.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.weather.settings]
        forecast_days = 3
        show_forecast = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."ayagmar/binance"]
target_crypto = 0
target_stable = 0
target_stocks = 100
targets_enabled = true

[plugin_settings."ayagmar/headroom"]
bar_accounts = "all"
bar_style = "value"
display = "remaining"
provider_antigravity = "off"
refresh_minutes = 3
window = "session"

[plugin_settings."ayagmar/obs-control"]
open_videos_after_stop = false

[plugins]
enabled = [
    "cleboost/jetbrains-provider",
    "ayagmar/obs-control",
    "ayagmar/binance",
    "ayagmar/headroom",
    "ayagmar/niri-computer-use"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
niri_overview_type_to_launch_enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Monochrome"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/ayagmar/Pictures/Wallpapers/Anime-Purple-eyes.png"

[wallpaper.last]
path = "/home/ayagmar/Pictures/Wallpapers/Anime-Purple-eyes.png"

