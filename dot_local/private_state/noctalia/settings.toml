config_version = 14

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."ayagmar/headroom"]
bar_accounts = "all"
bar_style = "value"
provider_antigravity = "panel"
refresh_minutes = 3
window = "session"

[plugin_settings."ayagmar/obs-control"]
open_videos_after_stop = false

[plugins]
enabled = [ "cleboost/jetbrains-provider", "ayagmar/obs-control", "ayagmar/headroom" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[theme]
builtin = "Tokyo-Night"
community_palette = "Monochrome"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/ayagmar/Pictures/Wallpapers/Anime-Purple-eyes.png"

[wallpaper.last]
path = "/home/ayagmar/Pictures/Wallpapers/Anime-Purple-eyes.png"

[wallpaper.monitors.DP-1]
path = "/home/ayagmar/Pictures/Wallpapers/Anime-Purple-eyes.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/ayagmar/Pictures/Wallpapers/Manga-Shrine.png"
theme_mode = "dark"
wallpaper_scheme = "m3-content"

